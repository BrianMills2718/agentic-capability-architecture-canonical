schema_version: 1

capabilities:
  core:
    status: core
    version: 0.1.0
    path: capabilities/core
    provides:
      - identity
      - configuration
      - shared_conventions
      - state.transition.plan
      - state.transition.audit_payload
    requires: []

  approvals:
    status: candidate
    version: 0.1.1
    path: capabilities/approvals
    runtime_path: capabilities/approvals/frappe_app/na_approvals
    provides:
      - approval.resolve
      - approval.require
      - approval.block
      - approval.action.bind
      - approval.action.verify
    requires:
      - core
    notes:
      - Rules resolve deterministically.
      - Explicit conflicts fail rather than being hidden by priority.
      - Project-specific ALLOW decisions must not silently weaken mandatory shared rules.
      - Action approval can be bound to an exact operation/action/target/payload digest and verified before execution.

  notifications:
    status: candidate
    version: 0.1.0
    path: capabilities/notifications
    runtime_path: capabilities/notifications/frappe_app/na_notifications
    provides:
      - notification.email.send
    requires:
      - core

  scheduling:
    status: candidate
    version: 0.1.0
    path: capabilities/scheduling
    runtime_path: capabilities/scheduling/frappe_app/na_scheduling
    provides:
      - appointment.create
      - appointment.cancel
      - appointment.reschedule
      - availability.query
    requires:
      - core
    optional:
      - approvals
      - notifications
