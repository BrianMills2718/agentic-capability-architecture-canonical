project: client_intake_booking
purpose: Staff-facing MVP for capturing client service intake and booking consultations.
capabilities:
  core: "^0.1.0"
  scheduling: "^0.1.0"
  approvals: "^0.1.0"
  notifications: "^0.1.0"
configuration:
  intake:
    service_types:
      - Consultation
      - Project Discovery
      - Support
    allowed_durations_minutes:
      - 30
      - 60
      - 90
      - 120
  approvals:
    require_over_minutes: 60
custom_extensions:
  - intake_booking
acceptance_scenarios:
  - staff can record a structured client intake and requested appointment
  - appointments of 60 minutes or less are confirmed automatically
  - appointments longer than 60 minutes are created pending approval
  - confirmation or pending-review email is sent through the shared notification adapter
  - intake-specific behavior remains outside shared capabilities
notes:
  - MVP is authenticated and staff-facing; a public guest form is deliberately deferred until abuse and privacy controls are specified.
reuse_notes:
  - Structured client intake is first-use local behavior and must not be promoted to a shared capability yet.
