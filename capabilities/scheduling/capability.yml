name: scheduling
status: candidate
version: 0.1.0
runtime: frappe

provides:
  - appointment.create
  - appointment.cancel
  - appointment.reschedule
  - availability.query

requires:
  - core

optional:
  - approvals
  - notifications

configuration:
  default_duration_minutes:
    type: integer
    default: 30
  cancellation_enabled:
    type: boolean
    default: true

public_model:
  Appointment:
    fields:
      - customer
      - start_time
      - duration_minutes
      - status
      - approval_required
      - approval_reason
evidence:
  materially_different_uses:
    - acme_reference
  third_use_checked: false

