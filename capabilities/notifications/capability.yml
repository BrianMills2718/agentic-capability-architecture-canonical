name: notifications
status: candidate
version: 0.1.0
runtime: frappe

provides:
  - notification.email.send

requires:
  - core

public_interfaces:
  - na_notifications.email.send_email

semantic_exports:
  - semantic_action: notification.send
    implementation: na_notifications.email.send_email
    implementation_version: 1
    inputs: [recipients, subject, message]
    outputs: [delivery_ref]

configuration:
  default_sender:
    type: string
    nullable: true

notes:
  - Scheduling or client extensions decide when a reminder is due.
  - This capability owns the transport adapter, not scheduling policy.
evidence:
  materially_different_uses: []
  third_use_checked: false
