schema_version: 1

candidates:
  - id: approval_action_workflow
    project: internal_procurement
    description: >-
      Repeated approval-gated action lifecycle pattern observed across Client Intake + Booking
      and Internal Procurement; preserve as a candidate for comparison rather than silently
      treating the existing approvals resolver as proven shared workflow behavior.
    status: candidate
    similar_to:
      - client_intake_booking
    evidence:
      - clients/internal_procurement/LEARNINGS.md identifies this as the second materially different implementation and explicitly recommends candidate status.
      - Both domains contain approval-gated actions plus domain-local lifecycle/notification semantics that should be compared before extraction.
    notes:
      - This candidate does not promote a workflow engine or the na_approvals rule resolver.
      - Current client uses of na_approvals resolve at most one rule at a time; multi-rule arbitration is now package-tested and exercised by a market-derived Upwork order-approval experiment, but it is still not validated by a materially different real client/production use.
      - The Upwork experiment passed the same hidden tests in control and treatment; the treatment composed approvals + core but was slower and much more context-expensive, so this is fit/compatibility evidence rather than promotion or economic evidence.
      - Promotion requires a narrow common surface that serves materially different domains without embedding their terminology or policy.
  - id: twitterapi_io_search_candidates_wrapper
    project: aca_plan_001_independent_composition
    description: >-
      Read-only TwitterAPI.io search wrapper search_candidates(query) returning normalized candidate
      dicts, recorded as an observed reuse result only. It is not a registered capability, has no
      manifest export, and is not promoted.
    status: observed
    evidence:
      - docs/experiments/independent-composition/twitterapi_io_collection.py (search_candidates, normalize_tweet), introduced in commit 072565d.
      - "Positive reuse: called by the scoring pipeline docs/experiments/independent-composition/live_pipeline.py and, unchanged, by the separate Engineering Signal Digest consumer docs/experiments/independent-composition/engineering_signal_digest.py (commit 17bcdf8)."
      - docs/experiments/independent-composition/AUDIT_ADDENDUM_2026-09-21.md records what was and was not verified.
    notes:
      - "Limitation - read-only: a single GET search; no effectful behavior, so it says nothing about approval binding or durable idempotency."
      - "Limitation - same repository, language, and domain family: both consumers live in one directory of one repository, are Python, and use Twitter search results; no cross-repository or cross-language consumption was tried."
      - "Limitation - guided use: the second consumer's brief names the boundary, so discovery and rejection were not exercised."
      - "Limitation - trivial subset: both consumers use one call plus field access, so no distinctive invariant of the wrapper was exercised. Non-object entries in the provider's tweets list are silently skipped, so a malformed-item warning requirement is not met."
      - "No economic control: there is no control arm and no measured time, token, dollar, or human-intervention cost; unknown is not zero."
      - "No packaging or version-drift evidence: the pinned revision was a same-directory import, not a dependency pin, and no provider or boundary version change was tested."
      - "Live evidence is prose only: the 2026-09-19 and 2026-09-20 runs have no retained machine receipt. The consumer test suite never calls the real boundary."
      - "Observed is intentional rather than candidate: the later caller exercised only a trivial read-only subset in the same repository/domain family, so the evidence does not yet establish a credible generalized capability surface. Do not register or promote on this evidence. A registered export must resolve a real public interface through the existing manifest and catalog conventions."
  - id: product_n_twitter_collection_boundary
    project: aca_plan_002_cross_repo_reuse
    description: >-
      Pre-existing Product N TwitterAPI.io multi-query collection behavior audited for cross-repository
      portability and then offered to a fresh Product N+1 treatment worker. Recorded as rejected-fit
      evidence, not as a promoted reusable capability.
    status: observed
    evidence:
      - docs/experiments/cross-repo-reuse/A1_BROWNFIELD_PORTABILITY.md records the brownfield publication audit and private pinned-artifact feasibility.
      - docs/experiments/cross-repo-reuse/A3_A4_RESULT.md records the frozen control/reuse pair and explicit treatment rejection.
    notes:
      - "Technical portability: byte-identical provider/model code ran after ordinary packaging/export normalization; no ACA runtime or registry service was needed."
      - "Publication debt: the source product had no installable package boundary and eager package initialization pulled in broader application/LLM dependencies."
      - "Rejected fit: the A3 treatment worker rejected the retained asset for offline dependency friction plus semantic mismatch with Product N+1 ranking, profile ownership, conflict-warning, and all-query-failure requirements."
      - "Economic result: treatment was 26.8% slower than control and materially more model-context/list-cost intensive; the asset was not executed by the submitted solution."
      - "Correctness result: treatment passed 35/35 hidden behavioral checks; control passed 33/35. Because the asset was rejected, do not attribute this correctness difference to code reuse."
      - "Do not register or promote from this evidence. Retain the rejection so later agents can avoid rediscovering the same mismatch or can reconsider only after a materially different consumer requirement or producer revision."
