name: Materialize fresh-agent acceptance sandbox

on:
  push:
    branches:
      - chatgpt/frappe-proof-20260905
    paths:
      - .github/workflows/materialize-acceptance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4

      - name: Reconstruct capability-base snapshot
        run: |
          cat \
            repair.part00.00 repair.part00.01 repair.part00.02 repair.part00.03 \
            payload.b64.part01 \
            repair.part02.00 repair.part02.01 repair.part02.02 repair.part02.03 \
            payload.b64.part03 payload.b64.part04 payload.b64.part05 payload.b64.part06 \
            > payload.all.b64
          base64 -d payload.all.b64 > frappe_proof_payload.tar.gz
          echo "900357df7be11d9aada844a1f43bb04b3a25b8e162d460c759417b3ac1157f64  frappe_proof_payload.tar.gz" | sha256sum -c -
          mkdir prepared
          tar -xzf frappe_proof_payload.tar.gz -C prepared

          # Keep the same module-package markers that passed the real Frappe proof.
          install -D proof_overlay/module_init.py prepared/capabilities/approvals/frappe_app/na_approvals/na_approvals/na_approvals/__init__.py
          install -D proof_overlay/module_init.py prepared/capabilities/notifications/frappe_app/na_notifications/na_notifications/na_notifications/__init__.py
          install -D proof_overlay/module_init.py prepared/clients/acme_reference/custom/frappe_app/acme_rules/acme_rules/acme_rules/__init__.py

      - name: Strip answer key and write plain acceptance task
        run: |
          rm -rf prepared/tests/acceptance
          rm -f prepared/tools/evaluate_acceptance.py
          rm -f prepared/tools/create_acceptance_sandbox.py
          rm -f prepared/tools/package_acceptance_test.py
          rm -f prepared/docs/ACCEPTANCE_TEST.md
          rm -f prepared/docs/ACCEPTANCE_RUNBOOK.md
          rm -f prepared/docs/ACCEPTANCE_REHEARSAL_RESULT.md
          rm -rf prepared/clients/beta_reference
          rm -rf prepared/.github

          cat > prepared/ACCEPTANCE_PROMPT.txt <<'PROMPT'
          Add a new project called `beta_reference`. It needs appointment scheduling, approvals for appointments over 90 minutes, and email reminders. Reuse what already exists where possible. Do not change existing project behavior.
          PROMPT

      - name: Replace disposable main branch with sandbox
        run: |
          shopt -s dotglob
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name prepared -exec rm -rf {} +
          cp -a prepared/. .
          rm -rf prepared

          git config user.name "ChatGPT Acceptance Setup"
          git config user.email "acceptance-setup@example.invalid"
          git add -A
          git commit -m "Prepare fresh-agent acceptance sandbox"
          git push origin HEAD:main --force
