name: Bootstrap fresh-agent acceptance sandbox

on:
  push:
    branches: [main]
    paths:
      - 'acceptance_payload/**'
      - '.github/workflows/bootstrap-acceptance.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct untouched acceptance sandbox
        shell: bash
        run: |
          cat acceptance_payload/chunk00 \
              acceptance_payload/chunk01 \
              acceptance_payload/chunk02 \
              acceptance_payload/chunk03 \
              acceptance_payload/chunk04 \
              acceptance_payload/chunk05 \
              acceptance_payload/chunk06 > acceptance_payload.b64
          base64 -d acceptance_payload.b64 > acceptance_payload.tar.gz
          echo '5cd493eb0648b3032659d358990644de3ef6466978f12bcd47a9d3e47358ff52  acceptance_payload.tar.gz' | sha256sum -c -
          tar -xzf acceptance_payload.tar.gz
          rm -rf acceptance_payload acceptance_payload.b64 acceptance_payload.tar.gz
          rm -f .github/workflows/bootstrap-acceptance.yml

      - name: Commit expanded sandbox
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expand untouched fresh-agent acceptance sandbox [skip ci]'
          git push origin HEAD:main
