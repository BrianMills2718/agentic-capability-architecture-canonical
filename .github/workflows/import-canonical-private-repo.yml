name: Import canonical private capability architecture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-canonical-private-repo.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve destination workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/target-workflows
          cp -a .github/workflows/. /tmp/target-workflows/

      - name: Download private migration artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://productionresultssa9.blob.core.windows.net/actions-results/20fe5112-3573-41ff-9cc0-1116586d9cac/workflow-job-run-749458b4-eb80-5a54-8da1-8e658e60f3f5/artifacts/d2f6aa7de4098497bd30719bfab9ae7513ff98687a48b83fb55c492968f15cfe.zip?rscd=attachment%3B+filename%3D%22agentic-capability-architecture-private-migration.zip%22&rsct=application%2Fzip&se=2026-09-07T02%3A19%3A57Z&sig=NMLzBRW8s0fla55O6ysAFhG1qEGjBSIOxWpyWTf6YTU%3D&ske=2026-09-07T05%3A54%3A40Z&skoid=ca7593d4-ee42-46cd-af88-8b886a2f84eb&sks=b&skt=2026-09-07T01%3A54%3A40Z&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skv=2025-11-05&sp=r&spr=https&sr=b&st=2026-09-07T02%3A09%3A52Z&sv=2025-11-05' -o /tmp/private-migration.zip
          rm -rf /tmp/private-migration
          mkdir -p /tmp/private-migration
          unzip -q /tmp/private-migration.zip -d /tmp/private-migration
          test -f /tmp/private-migration/agentic-capability-architecture.tar.gz

      - name: Replace worktree with canonical archive while preserving workflows
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/private-migration/agentic-capability-architecture.tar.gz -C .
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a /tmp/target-workflows/. .github/workflows/
          rm -rf .paper_transfer

      - name: Verify exact source paper
        shell: bash
        run: |
          set -euo pipefail
          test -f source_materials/From_Evidence_to_Action_v2.md
          echo 'c6d9237fc40b8a0ceacb2592b84c7a64a151fc25d6a97de8a86bcc729d7ebbdf  source_materials/From_Evidence_to_Action_v2.md' | sha256sum -c -
          test "$(wc -c < source_materials/From_Evidence_to_Action_v2.md)" -eq 197144

      - name: Commit canonical tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BrianMills2718'
          git config user.email '69022071+BrianMills2718@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Import canonical agentic capability architecture'
          git push origin HEAD:main
