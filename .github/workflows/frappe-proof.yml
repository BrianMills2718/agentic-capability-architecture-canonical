name: Composable capability base - Frappe proof

on:
  push:
    branches:
      - chatgpt/frappe-proof-20260905
  workflow_dispatch:

jobs:
  appointment-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -proot"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10

    env:
      BENCH_PATH: /home/runner/frappe-bench
      SITE: test_site
      DB_ROOT_PASSWORD: root
      ADMIN_PASSWORD: admin
      CI: "Yes"

    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4

      - name: Verify repaired payload fragments
        run: |
          cat <<'CHECKS' | sha256sum -c -
          884cbadcf0925473db8bfe0033a80140f8ab4444a7dc58ba7e96afe9a808bd10  repair.part00.00
          5103aca34c2cf9eeb0195503242372f79c3563802ec4b8b26badf2d9eb6de439  repair.part00.01
          91158dbc1c4d5831ca8934a70c1cd3644548d1103e5970a43776af2fbd8ab180  repair.part00.02
          8b5ad8399afa295b10c33150f901ff5c1036218a66391581940e62236d817768  repair.part00.03
          26cee2e6c46067f7c64f0e65df6305d1a0ab6cda32d755684a18372e07b3943a  repair.part02.00
          106bb8da8dfb8812accccd203dad24d00e5fccddbc0378a8f5d2b9884f0694d0  repair.part02.01
          0717342f56250c3d363a5e921cae3cd661e43b969c55ef04fba1e2ec229e1729  repair.part02.02
          87047ad747131774a836585101236d88b7664b47b4239f940d36906501725c17  repair.part02.03
          CHECKS

      - name: Reconstruct and extract capability-base snapshot
        run: |
          cat \
            repair.part00.00 repair.part00.01 repair.part00.02 repair.part00.03 \
            payload.b64.part01 \
            repair.part02.00 repair.part02.01 repair.part02.02 repair.part02.03 \
            payload.b64.part03 payload.b64.part04 payload.b64.part05 payload.b64.part06 \
            > payload.all.b64
          wc -c payload.all.b64
          base64 -d payload.all.b64 > frappe_proof_payload.tar.gz
          echo "900357df7be11d9aada844a1f43bb04b3a25b8e162d460c759417b3ac1157f64  frappe_proof_payload.tar.gz" | sha256sum -c -
          mkdir capability-base
          tar -xzf frappe_proof_payload.tar.gz -C capability-base
          test -f capability-base/tools/run_frappe_reference_tests.sh
          test -f capability-base/clients/acme_reference/custom/frappe_app/acme_rules/acme_rules/tests/test_appointment_hook.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bench dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client
          python -m pip install --upgrade pip
          python -m pip install frappe-bench

      - name: Initialize Frappe version-15 Bench
        run: |
          bench init \
            --frappe-branch version-15 \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" \
            "$BENCH_PATH"

          mariadb --host 127.0.0.1 --port 3306 -u root -p"$DB_ROOT_PASSWORD" \
            -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -p"$DB_ROOT_PASSWORD" \
            -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Configure external Redis services
        working-directory: ${{ env.BENCH_PATH }}
        run: |
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:11000

      - name: Create test site
        working-directory: ${{ env.BENCH_PATH }}
        run: |
          bench new-site "$SITE" \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --db-root-password "$DB_ROOT_PASSWORD" \
            --admin-password "$ADMIN_PASSWORD"

      - name: Run real Appointment lifecycle tests
        working-directory: ${{ env.BENCH_PATH }}
        env:
          CAPABILITY_BASE: ${{ github.workspace }}/capability-base
        run: |
          bash "$CAPABILITY_BASE/tools/run_frappe_reference_tests.sh"
