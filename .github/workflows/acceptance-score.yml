name: External acceptance score

on:
  push:
    branches:
      - chatgpt/score-final-2299a57
  workflow_dispatch:

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bootstrap test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Score frozen fresh-agent submission
        run: python .acceptance/evaluate.py
