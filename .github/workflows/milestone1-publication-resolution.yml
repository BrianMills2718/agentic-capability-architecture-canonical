name: capability-publication-resolution

on:
  push:
    branches:
      - milestone-1-actionpack-publication

jobs:
  resolve-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install proof dependencies
        run: python -m pip install pyyaml pytest
      - name: Validate maintained capability publication
        run: python tools/validate_capability_publication.py
      - name: Validate generic behavior requirement resolution
        run: python -m pytest -q tests/compatibility/test_behavior_requirement_resolution.py
      - name: Validate milestone publication compatibility
        run: python tools/resolve_milestone1_publication.py
      - name: Run focused provider smoke
        run: python -m pytest -q tests/compatibility/test_milestone1_runtime_smoke.py
      - name: Run runtime execution receipt proof
        run: python -m pytest -q tests/compatibility/test_runtime_execution_receipts.py
