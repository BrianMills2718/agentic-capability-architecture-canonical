name: milestone1-publication-resolution

on:
  push:
    branches:
      - milestone-1-actionpack-publication

jobs:
  resolve-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YAML parser
        run: python -m pip install pyyaml
      - name: Validate published interfaces
        run: python tools/resolve_milestone1_publication.py
